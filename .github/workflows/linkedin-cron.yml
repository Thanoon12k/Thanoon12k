name: LinkedIn autopost

# Wakes the LinkedIn Autopost app on PythonAnywhere every hour. The app decides:
# it publishes at most one queued post per posting day, at or after the hour
# chosen in its Setup page, so the other runs are harmless no-ops.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled post
        run: curl -fsS --max-time 120 https://apps1monitor.pythonanywhere.com/cron
