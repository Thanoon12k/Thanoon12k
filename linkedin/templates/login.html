{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block heading %}<span class="row"><img src="{{ url_for('favicon') }}" width="36" height="36" alt="">Autopost</span>{% endblock %}
{% block content %}
<form method="post" class="card stack"><input type="hidden" name="csrf" value="{{ csrf }}">
  <div><label style="margin-top:0">Password</label><input type="password" name="password" autofocus autocomplete="current-password"></div>
  <button class="brand" style="width:100%">Log in</button>
</form>
{% endblock %}
